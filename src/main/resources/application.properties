# ------------------------------------------------------------------
# Aucun mot de passe dans ce fichier : il est versionné sur GitHub.
# Les vraies valeurs vont dans application-local.properties
# (même dossier, ignoré par Git), ou dans des variables d'environnement.
# ------------------------------------------------------------------
spring.config.import=optional:classpath:application-local.properties

spring.jpa.hibernate.ddl-auto=update
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/domesservice}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
