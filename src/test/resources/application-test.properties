# Profil "test" : base H2 en mémoire, recréée à chaque lancement des tests.
# Aucun MySQL / WAMP nécessaire pour lancer ./mvnw test
spring.datasource.url=jdbc:h2:mem:domes;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop

# Pas de données de démo : chaque test crée les siennes
spring.sql.init.mode=never

# Le login "admin" a le rôle ADMIN pendant les tests
domes.admin.logins=admin
contact.destinataire=test@domes.fr

# Photos envoyées pendant les tests
domes.uploads.dir=target/test-uploads
