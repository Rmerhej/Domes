# Intégration continue : à chaque push sur main et à chaque pull request,
# GitHub lance les tests et vérifie que l'image Docker se construit.
# Résultats : onglet « Actions » du dépôt, et coche verte / croix rouge sur chaque PR.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:        # bouton « Run workflow » pour lancer à la main

# Un nouveau push sur la même branche annule l'exécution précédente, devenue inutile
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven            # garde les dépendances Maven d'une exécution à l'autre

      - name: Lancer les tests
        run: ./mvnw -B test       # base H2 en mémoire : pas besoin de MySQL

      - name: Garder les rapports si un test échoue
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rapports-tests
          path: target/surefire-reports/
          retention-days: 7

  docker:
    name: Image Docker
    runs-on: ubuntu-latest
    needs: tests                  # seulement si les tests passent
    timeout-minutes: 20
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Construire l'image (sans la publier)
        run: docker build -t domes:ci .
